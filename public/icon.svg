<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Antenna stem -->
  <line x1="16" y1="2" x2="16" y2="8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <!-- Antenna bulb -->
  <circle cx="16" cy="2" r="2" fill="#00ccff" />
  
  <!-- Robot Head Outline/Body -->
  <rect x="6" y="8" width="20" height="20" rx="4" fill="#fafafa" stroke="#1f2937" stroke-width="1.5" />
  
  <!-- Visor Background -->
  <rect x="9" y="14" width="14" height="8" rx="2" fill="#111111" />
  
  <!-- Left Eye -->
  <rect x="11" y="16" width="3" height="4" rx="1" fill="#3b82f6" />
  
  <!-- Right Eye -->
  <rect x="18" y="16" width="3" height="4" rx="1" fill="#3b82f6" />
  
  <!-- Eye Glow (optional, subtle) -->
  <rect x="11.5" y="16.5" width="2" height="3" rx="0.5" fill="#60a5fa" />
  <rect x="18.5" y="16.5" width="2" height="3" rx="0.5" fill="#60a5fa" />
</svg>
